<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title> </title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body { overscroll-behavior: none; }
    .screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }
    .backdrop, .video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .backdrop {
      z-index: -1;
      object-fit: cover;
      filter: blur(30px) brightness(.52);
      transform: scale(1.12);
    }
    .video { object-fit: contain; }
    .tap-surface {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tap-surface:focus { outline: none; }
  </style>
</head>
<body>
  <main class="screen">
    <video class="backdrop" id="backdrop" muted autoplay loop playsinline preload="auto" aria-hidden="true">
      <source src="assets/carta-fechada.mp4" type="video/mp4">
    </video>
    <video class="video" id="video" muted autoplay loop playsinline preload="auto">
      <source src="assets/carta-fechada.mp4" type="video/mp4">
    </video>
    <button class="tap-surface" id="tapSurface" type="button" aria-label="Abrir a carta"></button>
  </main>
  <script>
    const parts = [
      "assets/narracao/parte-01.bin",
      "assets/narracao/parte-02.bin",
      "assets/narracao/parte-03.bin",
      "assets/narracao/parte-04.bin",
      "assets/narracao/parte-05.bin",
      "assets/narracao/parte-06.bin",
      "assets/narracao/parte-07.bin",
      "assets/narracao/parte-08.bin",
      "assets/narracao/parte-09.bin",
      "assets/narracao/parte-10.bin"
    ];
    const video = document.getElementById("video");
    const backdrop = document.getElementById("backdrop");
    const tapSurface = document.getElementById("tapSurface");
    let videoUrl = null;
    let preparePromise = null;
    let opened = false;
    let loading = false;

    function prepareNarration() {
      if (preparePromise) return preparePromise;
      preparePromise = Promise.all(parts.map(async (path) => {
        const response = await fetch(path);
        if (!response.ok) throw new Error("Video unavailable");
        return response.arrayBuffer();
      })).then((chunks) => URL.createObjectURL(new Blob(chunks, { type: "video/mp4" })))
        .then((url) => {
          videoUrl = url;
          return url;
        })
        .catch((error) => {
          preparePromise = null;
          throw error;
        });
      return preparePromise;
    }

    async function openCard() {
      if (loading) return;
      if (opened && videoUrl) {
        if (video.paused) video.play().catch(() => {});
        return;
      }
      opened = true;
      loading = true;
      try {
        const url = await prepareNarration();
        video.pause();
        backdrop.pause();
        video.removeAttribute("loop");
        video.muted = false;
        video.src = url;
        video.load();
        video.play().catch(() => {});
        backdrop.src = url;
        backdrop.load();
        backdrop.play().catch(() => {});
      } catch (error) {
        opened = false;
      } finally {
        loading = false;
      }
    }

    tapSurface.addEventListener("click", openCard);
    tapSurface.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openCard();
      }
    });

    video.addEventListener("loadeddata", () => {
      window.setTimeout(() => prepareNarration().catch(() => {}), 900);
    }, { once: true });
  </script>
</body>
</html>
