<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f2">
  <meta name="description" content="Abra a carta e assista ao convite dos 11 anos da Agatha.">
  <title>Agatha faz 11 anos!</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #392638;
      --muted: #765d72;
      --pink: #e94f91;
      --gold: #e7aa50;
      --paper: #fffdfb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: ui-rounded, "Avenir Next", Avenir, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 12% 15%, rgba(255, 196, 220, .58), transparent 34%),
        radial-gradient(ellipse at 90% 85%, rgba(255, 221, 166, .58), transparent 34%),
        #fff8f2;
    }
    main { width: min(100%, 560px); text-align: center; }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--pink);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 10vw, 5rem);
      line-height: .98;
      letter-spacing: -.065em;
    }
    h1 span { color: var(--pink); }
    .intro {
      margin: 15px 0 22px;
      color: var(--muted);
      font-size: clamp(1rem, 3vw, 1.15rem);
      line-height: 1.55;
    }
    .card-scene { width: min(100%, 380px); margin: 0 auto; }
    .card-button {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      padding: 0;
      overflow: hidden;
      border: 8px solid var(--paper);
      border-radius: 24px;
      background: #f4dce6;
      box-shadow: 0 20px 60px rgba(98, 47, 78, .2);
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .card-button:hover { transform: translateY(-4px); box-shadow: 0 26px 64px rgba(98, 47, 78, .25); }
    .card-button:focus-visible { outline: 3px solid var(--pink); outline-offset: 5px; }
    .card-button video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tap-label {
      position: absolute;
      right: 14px;
      bottom: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 999px;
      color: white;
      background: rgba(63, 35, 55, .72);
      backdrop-filter: blur(8px);
      font-size: .98rem;
      font-weight: 750;
      text-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    .heart { color: #ffc2dc; font-size: 1.15rem; }
    .hint { margin: 14px 0 0; color: var(--muted); font-size: .93rem; font-weight: 700; }
    .letter-content {
      width: min(100%, 440px);
      margin: 0 auto;
      padding: 12px;
      border: 1px solid rgba(90, 57, 77, .1);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 20px 60px rgba(98, 47, 78, .16);
      animation: arrive .45s both;
    }
    .letter-content[hidden] { display: none; }
    .letter-content h2 { margin: 5px 0 12px; font-family: Georgia, serif; font-size: 1.45rem; font-weight: 500; }
    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 14px;
      background: #f4dce6;
    }
    .video-frame video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .loading-message { min-height: 1.5em; margin: 12px 0 2px; color: var(--muted); font-size: .94rem; }
    .letter-content[hidden] + .hint { display: none; }
    footer { margin-top: 22px; color: var(--muted); font-size: .88rem; }
    .sparkle { color: var(--gold); }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (max-width: 420px) {
      body { padding: 24px 13px; }
      .card-button { border-width: 6px; border-radius: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Uma surpresa especial</p>
    <h1>Agatha <span>faz 11!</span></h1>
    <p class="intro">Chegou uma cartinha para você.<br>Toque nela para abrir!</p>

    <section class="card-scene" id="cardScene" aria-label="Carta fechada">
      <button class="card-button" id="openLetter" type="button" aria-label="Abrir a carta da Agatha">
        <video src="assets/carta-fechada.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
        <span class="tap-label"><span class="heart" aria-hidden="true">♥</span> Toque para abrir</span>
      </button>
    </section>
    <p class="hint" id="hint">A carta está esperando por você</p>

    <section class="letter-content" id="letterContent" aria-labelledby="letterTitle" hidden>
      <h2 id="letterTitle">Um convite feito com carinho</h2>
      <div class="video-frame" id="videoFrame"></div>
      <p class="loading-message" id="loadingMessage" role="status" aria-live="polite"></p>
    </section>

    <footer><span class="sparkle" aria-hidden="true">✦</span> Feito com carinho por Adri Ribeiro <span class="sparkle" aria-hidden="true">✦</span></footer>
  </main>
  <script>
    const openLetter = document.getElementById("openLetter");
    const cardScene = document.getElementById("cardScene");
    const hint = document.getElementById("hint");
    const letterContent = document.getElementById("letterContent");
    const videoFrame = document.getElementById("videoFrame");
    const loadingMessage = document.getElementById("loadingMessage");
    const chunkFiles = [
      "assets/narracao/parte-01.bin",
      "assets/narracao/parte-02.bin",
      "assets/narracao/parte-03.bin",
      "assets/narracao/parte-04.bin",
      "assets/narracao/parte-05.bin",
      "assets/narracao/parte-06.bin",
      "assets/narracao/parte-07.bin",
      "assets/narracao/parte-08.bin",
      "assets/narracao/parte-09.bin",
      "assets/narracao/parte-10.bin"
    ];
    let loading = false;
    let videoUrl;

    openLetter.addEventListener("click", async () => {
      if (loading || videoUrl) return;
      loading = true;
      openLetter.disabled = true;
      cardScene.hidden = true;
      hint.hidden = true;
      letterContent.hidden = false;
      loadingMessage.textContent = "Abrindo sua carta… preparando o vídeo";
      letterContent.scrollIntoView({ behavior: "smooth", block: "center" });

      try {
        let loaded = 0;
        const pieces = await Promise.all(chunkFiles.map(async (path) => {
          const response = await fetch(path);
          if (!response.ok) throw new Error("Não foi possível carregar o vídeo.");
          const bytes = await response.arrayBuffer();
          loaded += 1;
          loadingMessage.textContent = loaded < chunkFiles.length
            ? `Preparando o vídeo… (${loaded} de ${chunkFiles.length})`
            : "Quase pronto…";
          return bytes;
        }));

        videoUrl = URL.createObjectURL(new Blob(pieces, { type: "video/mp4" }));
        const player = document.createElement("video");
        player.src = videoUrl;
        player.controls = true;
        player.autoplay = true;
        player.playsInline = true;
        player.preload = "auto";
        player.setAttribute("aria-label", "Convite narrado: Agatha faz 11 anos");
        videoFrame.replaceChildren(player);
        loadingMessage.textContent = "";
        const playback = player.play();
        if (playback) playback.catch(() => {
          loadingMessage.textContent = "A carta abriu. Toque em ▶ para assistir ao vídeo.";
        });
      } catch (error) {
        loadingMessage.textContent = "Não foi possível carregar o vídeo. Toque na carta para tentar novamente.";
        cardScene.hidden = false;
        hint.hidden = false;
        openLetter.disabled = false;
        videoFrame.replaceChildren();
        letterContent.hidden = true;
        loading = false;
      }
    });
  </script>
</body>
</html>
